*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02192d;color:#fff7df;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Rounded",system-ui,sans-serif}button{font:inherit}.app{min-height:100svh;max-width:620px;margin:auto;position:relative;overflow:hidden;padding:calc(10px + env(safe-area-inset-top)) 10px calc(86px + env(safe-area-inset-bottom));background:#031e35}.bg{position:fixed;inset:0;left:50%;width:min(100%,620px);transform:translateX(-50%);background:linear-gradient(180deg,#01192a66,#011522e8),url('https://o-some.github.io/tulasisland/assets/creative/world_harbor.webp') center/cover;z-index:0}.bg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,#ffffff08 0 2px,transparent 2px 20px),radial-gradient(circle at 78% 42%,#46e4c822,transparent 24%)}.layer{position:relative;z-index:1}.hud{display:grid;gap:7px;padding-bottom:10px}.top{display:flex;gap:7px;align-items:center}.pill,.icon,.stat{border:1px solid #efc766aa;background:#022c4ae8;box-shadow:inset 0 1px #ffffff14,0 8px 20px #00102055;color:#fff0bd}.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem}.brand{flex:1;min-height:44px;border-radius:999px;padding:6px 12px;display:flex;align-items:center;justify-content:space-between}.brand b{font:900 1rem Georgia,serif}.brand small{display:block;color:#c9e6e7;font-size:.55rem;letter-spacing:.08em}.stats{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px}.stat{border-radius:16px;padding:7px 10px;min-height:42px}.stat small{display:block;color:#b8dce0;font-size:.5rem;letter-spacing:.1em;font-weight:900}.stat b{font-size:.9rem}.hud2{display:flex;justify-content:flex-end;gap:7px}.level,.wallet{border-radius:999px;min-height:44px;padding:5px 12px;display:grid;place-items:center}.level small,.wallet small{font-size:.44rem;color:#b8dce0;letter-spacing:.08em}.level b,.wallet b{font-size:.72rem;color:#ffe49a}.game{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:8px;align-items:start}.card{min-height:520px;border:2px solid #e6b94c;border-radius:27px;padding:18px 12px;background:linear-gradient(160deg,#063c60f2,#021f37fa);box-shadow:inset 0 0 0 5px #001d33aa,inset 0 1px #ffffff18,0 24px 50px #00091488;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:8px;border:1px solid #f1cf7733;border-radius:20px;background:repeating-linear-gradient(122deg,#ffffff08 0 2px,transparent 2px 18px);pointer-events:none}.card>*{position:relative;z-index:1}.eyebrow{display:flex;justify-content:space-between;color:#efc766;font-size:.52rem;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.prompt{text-align:center;margin:26px 0 20px}.prompt h1{margin:0 0 7px;font:900 clamp(2rem,10vw,3.1rem)/.96 Georgia,serif;color:#fff0bd;text-shadow:0 4px 16px #000b18}.prompt p{margin:auto;max-width:31ch;color:#d8eeee;font-size:.72rem;line-height:1.45;font-weight:700}.label{display:block;text-align:center;color:#efc766;font-size:.5rem;font-weight:950;letter-spacing:.17em;margin-bottom:8px}.slots,.tiles{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}.slot{width:min(42px,calc((100% - 40px)/var(--n)));height:42px;border:1px solid #efc76688;border-bottom:3px solid #d39b2e;border-radius:11px;background:#021d32cc;display:grid;place-items:center;font:900 1.05rem Georgia,serif}.slot.filled{background:linear-gradient(#fff0b0,#e9bb4d);color:#082f4b}.tiles{margin:8px 0 18px}.tile{min-width:38px;width:min(48px,calc((100% - 44px)/var(--n)));height:52px;border:1px solid #fff0a8;border-bottom:5px solid #78460e;border-radius:14px;background:linear-gradient(#ffe79a,#e8b43f 55%,#b87519);box-shadow:inset 0 2px #fff8,0 5px 0 #78460e;color:#082f4b;font:950 1.25rem Georgia,serif}.tile.used{opacity:.12}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:18px}.tool{min-height:48px;border:1px solid #efc76688;border-radius:16px;background:#032f50dd;color:#fff0bd;font-weight:850;font-size:.62rem}.check{grid-column:1/-1;min-height:58px;border:1px solid #fff0a8;border-radius:17px;background:linear-gradient(#ffe895,#e3b13d 55%,#b97418);box-shadow:0 6px 0 #75430e;color:#092f4b;font-weight:1000;font-size:1rem}.side{min-height:450px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:54px}.tula{width:110px;max-width:125%;filter:drop-shadow(0 18px 14px #0008)}.bubble{position:absolute;top:80px;right:55px;min-width:90px;padding:7px 8px;border:1px solid #efc766;border-radius:14px 14px 4px 14px;background:#022c4af2;color:#ffe8a4;font-size:.54rem;font-weight:900}.feedback{position:absolute;top:4px;right:-2px;width:145px;padding:8px 9px;border:1px solid #70d9ad;border-radius:15px;background:#075847f3;box-shadow:0 12px 24px #00102088;font-size:.56rem;line-height:1.3;z-index:8}.feedback.bad{background:#5a2430f3;border-color:#ef8e8e}.feedback b{display:block;color:#fff0bd;font-size:.75rem;margin-bottom:2px}.journey{grid-column:1/-1;margin-top:10px;min-height:82px;border:1px solid #efc766aa;border-radius:23px;background:#022c4aee;padding:10px 11px;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.journey small{color:#f3ca62;font-size:.47rem;font-weight:900}.track{height:8px;background:#ffffff1c;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,#efc766,#ffe18a)}.bossSide{justify-content:flex-start;align-items:center;padding:86px 0 50px;overflow:visible}.bossImg{width:126px;max-width:145%;filter:drop-shadow(0 20px 18px #000a)}.bossPlate{position:absolute;top:26px;left:4px;right:-4px;padding:7px 8px;border:1px solid #e8b94d;border-radius:12px;background:linear-gradient(#75451f,#351d12);text-align:center;font:900 .66rem Georgia,serif}.bossHp{margin:8px 0;padding:8px 10px;border:1px solid #e8b94d;border-radius:15px;background:#02283fee;display:flex;justify-content:space-between;font-size:.72rem}.bossHp b{color:#ff756a}.bossFeedback{position:absolute;top:2px;left:0;right:-12px;padding:8px;border:1px solid #ef8e8e;border-radius:14px;background:#51202af2;font-size:.56rem;z-index:10}.bossFeedback.goodForBoss{background:#075847f3;border-color:#70d9ad}.settings{position:fixed;inset:0;background:#00101bbb;z-index:30;display:grid;place-items:start center;padding:80px 10px 20px}.sheet{width:min(480px,100%);background:#032d4bf9;border:1px solid #efc766;border-radius:24px;padding:18px}.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.diffs button{min-height:52px;border:1px solid #efc76688;border-radius:14px;background:#021f36;color:#fff0bd;font-weight:900}.diffs button.on{background:linear-gradient(#ffe18a,#dca43a);color:#082f4b}.pause{position:fixed;inset:0;background:#00101bcc;z-index:40;display:grid;place-items:center;padding:18px}.modal{width:min(420px,100%);background:#032d4bf9;border:1px solid #efc766;border-radius:25px;padding:22px;text-align:center}.modal button{width:100%;min-height:50px;margin-top:9px;border-radius:15px;font-weight:900}.primary{border:0;background:linear-gradient(#ffe18a,#dca43a);color:#082f4b}.secondary{border:1px solid #efc76688;background:#021f36;color:#fff0bd}.hidden{display:none}@media(max-width:380px){.app{padding-left:7px;padding-right:7px}.game{grid-template-columns:minmax(0,1fr) 74px}.side{min-height:410px}.tula{width:98px}.tile{min-width:33px}.prompt h1{font-size:1.8rem}}
</style></head><body><div class="app"><div class="bg"></div><div class="layer"><header class="hud"><div class="top"><button class="icon" id="exit">‹</button><div class="brand pill"><span><b>WORD SCRAMBLE</b><small>DE → EN · EASY</small></span><span>⚙</span></div></div><div class="stats"><div class="stat"><small>PUNKTE</small><b id="score">0</b></div><div class="stat"><small>COMBO</small><b id="combo">x0</b></div><div class="stat"><small>LEBEN</small><b id="lives">♥♥♥</b></div></div><div class="hud2"><button class="level pill" id="level"><small>LEVEL</small><b id="difficultyLabel">Leicht</b></button><div class="wallet pill"><small>MUSCHELN</small><b id="shells">0</b></div><button class="icon" id="pause">Ⅱ</button></div></header><main id="game"></main></div></div><div class="settings hidden" id="settings"><div class="sheet"><h2>Schwierigkeit</h2><div class="diffs"><button data-d="easy">Leicht</button><button data-d="medium">Mittel</button><button data-d="hard">Schwer</button></div><button class="secondary" id="closeSettings">Schließen</button></div></div><div class="pause hidden" id="pauseModal"><div class="modal"><h2>Pause</h2><p>Dein Run bleibt erhalten.</p><button class="primary" id="resume">Weiter spielen</button><button class="secondary" id="endGame">Spiel beenden</button></div></div><script>
window.__WS_BASE_RUNTIME__='20260822-local-base-1';const BOSS_AFTER_NORMAL_ROUNDS=3;const WORDS=[["Tisch","TABLE"],["müde","TIRED"],["blau","BLUE"],["tanzen","DANCE"],["Insel","ISLAND"],["Schule","SCHOOL"],["Freund","FRIEND"],["Wasser","WATER"],["Reise","TRAVEL"],["Garten","GARDEN"],["Familie","FAMILY"],["Flughafen","AIRPORT"],["Abenteuer","ADVENTURE"],["Schildkröte","TURTLE"],["Schatz","TREASURE"],["Piraten","PIRATES"],["Kapitän","CAPTAIN"],["Muschel","SHELL"],["Hafen","HARBOR"],["Karte","MAP"]];const bossImg='../assets/bosses/level-01-pirat-kai.webp?v=runtime-local-base-1';const tula={waving:'https://o-some.github.io/tulasisland/assets/creative/tula_waving.webp',celebrating:'https://o-some.github.io/tulasisland/assets/creative/tula_celebrating.webp',surprised:'https://o-some.github.io/tulasisland/assets/creative/tula_surprised.webp'};let s={i:0,score:0,combo:0,lives:3,shells:0,diff:'easy',normal:0,boss:false,bossHp:3,bossMiss:0,sel:[],tiles:[],feedback:null};const $=x=>document.querySelector(x),game=$('#game');function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function cur(){return WORDS[s.i%WORDS.length]}function fallbackBossAnswer(){return'BOSS'}function currentAnswer(){return(s.boss?fallbackBossAnswer():cur()[1]).toUpperCase()}function setup(){s.sel=[];s.tiles=shuffle([...currentAnswer()]);render()}function hearts(n){return'♥'.repeat(Math.max(0,n))+'♡'.repeat(Math.max(0,3-n))}function render(){$('#score').textContent=s.score.toLocaleString('de-DE');$('#combo').textContent='x'+s.combo;$('#lives').textContent=hearts(s.lives);$('#shells').textContent=s.shells;$('#difficultyLabel').textContent=s.diff==='easy'?'Leicht':s.diff==='medium'?'Mittel':'Schwer';document.querySelector('.brand small').textContent='DE → EN · '+s.diff.toUpperCase();const p=Math.min(100,(s.normal/BOSS_AFTER_NORMAL_ROUNDS)*100),answer=currentAnswer(),prompt=s.boss?'Boss lädt …':cur()[0],side=s.boss?`<aside class="side bossSide">${feedbackBoss()}<div class="bossPlate">LEVEL 1 · PIRAT KAI</div><img class="bossImg" src="${bossImg}"><div class="bubble">Zeig mir, was du kannst!</div></aside>`:`<aside class="side">${feedbackTula()}<img class="tula" src="${s.feedback?.ok?tula.celebrating:s.feedback&&!s.feedback.ok?tula.surprised:tula.waving}"><div class="bubble">${s.feedback?.ok?'Super!':s.feedback?'Fast!':'Los geht’s!'}</div></aside>`;game.innerHTML=`<section class="game"><section class="card"><div class="eyebrow"><span>${s.boss?'BOSS · RUNDE 1/3':'DE → EN · '+s.diff.toUpperCase()}</span><span>${s.boss?'☠ BOSS':'TULA’S ISLAND'}</span></div>${s.boss?`<div class="bossHp"><span>BOSS-LEBEN</span><b>${hearts(s.bossHp)}</b></div>`:''}<div class="prompt"><h1>${prompt}</h1><p>${s.boss?'Der Satzmodus wird vorbereitet.':'Setze die richtige Übersetzung auf Englisch zusammen.'}</p></div><span class="label">DEIN WORT</span><div class="slots" style="--n:${answer.length}">${[...answer].map((_,i)=>`<div class="slot ${s.sel[i]?'filled':''}">${s.sel[i]?.l||s.sel[i]||''}</div>`).join('')}</div><span class="label" style="margin-top:18px">BUCHSTABEN</span><div class="tiles" style="--n:${answer.length}">${s.tiles.map((x,i)=>`<button class="tile ${s.sel.some(v=>v.id===i)?'used':''}" data-i="${i}">${x}</button>`).join('')}</div><div class="actions"><button class="tool" id="undo">↶<br>Zurück</button><button class="tool" id="clear">⌫<br>Löschen</button><button class="tool" id="hint">💡<br>Tipp</button><button class="check" id="check">Prüfen ✓</button></div></section>${side}<section class="journey"><div><small>INSELPFAD</small><br><b>${s.boss?'Boss aktiv':'Zum Boss'}</b></div><div class="track" style="--p:${s.boss?100:p}%"><i></i></div><b>${s.boss?'1/3':Math.min(s.normal,BOSS_AFTER_NORMAL_ROUNDS)+'/'+BOSS_AFTER_NORMAL_ROUNDS}</b></section></section>`;bind()}function feedbackTula(){if(!s.feedback)return'';return`<div class="feedback ${s.feedback.ok?'':'bad'}"><b>${s.feedback.ok?'Richtig!':'Noch nicht.'}</b>${s.feedback.msg}</div>`}function feedbackBoss(){if(!s.feedback)return'';return`<div class="bossFeedback ${!s.feedback.ok?'goodForBoss':''}"><b>${s.feedback.ok?'Treffer!':'Haha!'}</b><br>${s.feedback.msg}</div>`}function bind(){document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,a=currentAnswer();if(s.sel.length<a.length&&!s.sel.some(v=>v.id===i)){s.sel.push({id:i,l:s.tiles[i]});render()}});$('#undo').onclick=()=>{s.sel.pop();render()};$('#clear').onclick=()=>{s.sel=[];render()};$('#hint').onclick=()=>{const a=currentAnswer(),k=s.sel.length;if(k<a.length){const idx=s.tiles.findIndex((x,i)=>x===a[k]&&!s.sel.some(v=>v.id===i));if(idx>=0)s.sel.push({id:idx,l:s.tiles[idx]});render()}};$('#check').onclick=check}function check(){const a=currentAnswer(),v=s.sel.map(x=>x.l).join('');if(v.length!==a.length)return;const ok=v===a;s.feedback={ok,msg:ok?'Sauber gelöst.':'Richtig wäre: '+a};if(s.boss){if(ok){s.bossHp--;s.score+=180;s.shells++;s.combo++}else s.bossMiss++;render();setTimeout(()=>{if(s.bossHp<=0||s.bossMiss>=3){s.boss=false;s.normal=0;s.bossHp=3;s.bossMiss=0;s.i++}s.feedback=null;setup()},1000);return}if(ok){s.score+=100;s.shells++;s.combo++}else{s.lives--;s.combo=0}s.normal++;render();setTimeout(()=>{if(s.lives<=0){s.lives=3;s.score=0;s.combo=0;s.normal=0}else if(s.normal>=BOSS_AFTER_NORMAL_ROUNDS){s.boss=true;s.bossHp=3;s.bossMiss=0}else s.i++;s.feedback=null;setup()},1000)}$('#level').onclick=()=>{$('#settings').classList.remove('hidden');document.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===s.diff))};$('#closeSettings').onclick=()=>$('#settings').classList.add('hidden');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{s.diff=b.dataset.d;$('#settings').classList.add('hidden');render()});$('#pause').onclick=()=>$('#pauseModal').classList.remove('hidden');$('#resume').onclick=()=>$('#pauseModal').classList.add('hidden');$('#endGame').onclick=()=>location.href='../';$('#exit').onclick=()=>location.href='../';document.documentElement.dataset.wsBaseRuntime='ready';window.dispatchEvent(new CustomEvent('ws-base-ready',{detail:{version:window.__WS_BASE_RUNTIME__}}));setup();
</script></body></html>
