<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#032f50">
<title>Word Scramble · Tula’s Island</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#032f50}iframe{display:block;width:100%;height:100%;border:0;background:#032f50}
</style>
</head>
<body>
<iframe id="game" title="Word Scramble" allow="fullscreen; autoplay" src="https://o-some.github.io/tulasisland/word-scramble-preview/?letter-render-fix=2&boss-sprite-fix=3&difficulty-polish=1" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
const gameFrame=document.getElementById('game');
gameFrame.addEventListener('load',()=>{
  try{
    const doc=gameFrame.contentDocument;
    if(!doc)return;

    if(!doc.getElementById('word-scramble-success-sparkle-style')){
      const style=doc.createElement('style');
      style.id='word-scramble-success-sparkle-style';
      style.textContent=`
        .ws-tula-sparkle-layer{position:absolute;inset:0;z-index:7;overflow:visible;pointer-events:none}
        .ws-tula-sparkle-layer::before{content:"";position:absolute;left:50%;bottom:108px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,225,138,.22),rgba(121,217,199,.09) 34%,transparent 68%);transform:translate(-50%,50%) scale(.7);opacity:0;animation:wsTulaSuccessGlow .72s ease-out forwards}
        .ws-tula-sparkle{position:absolute;left:50%;bottom:108px;font-size:14px;line-height:1;opacity:0;will-change:transform,opacity;text-shadow:0 0 9px currentColor,0 2px 3px rgba(0,0,0,.28);animation:wsTulaSparkBurst .72s ease-out forwards}
        @keyframes wsTulaSuccessGlow{0%{opacity:0;transform:translate(-50%,50%) scale(.68)}28%{opacity:1;transform:translate(-50%,50%) scale(1)}100%{opacity:0;transform:translate(-50%,50%) scale(1.12)}}
        @keyframes wsTulaSparkBurst{0%{opacity:0;transform:translate(-50%,0) scale(.42) rotate(0deg)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(1.08) rotate(var(--rot))}}
        @media(prefers-reduced-motion:reduce){.ws-tula-sparkle,.ws-tula-sparkle-layer::before{animation-duration:.12s!important}}
      `;
      doc.head.appendChild(style);
    }

    if(!doc.getElementById('word-scramble-boss-polish-style')){
      const bossStyle=doc.createElement('style');
      bossStyle.id='word-scramble-boss-polish-style';
      bossStyle.textContent=`
        .bossSide{overflow:visible!important;isolation:isolate}
        .bossSide::before{content:"";position:absolute;z-index:0;left:46%;bottom:84px;width:138px;height:175px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(239,199,102,.20),rgba(36,193,184,.08) 42%,transparent 72%);filter:blur(1px);pointer-events:none}
        .bossImg{width:150px!important;max-width:none!important;height:auto!important;max-height:330px!important;object-fit:contain!important;object-position:center bottom!important;margin-left:-26px!important;position:relative!important;z-index:4!important;transform-origin:50% 92%!important;filter:drop-shadow(0 20px 17px rgba(0,0,0,.62)) drop-shadow(0 0 10px rgba(239,199,102,.22));will-change:transform,filter,opacity}
        .bossImg.ws-boss-enter{animation:wsBossEnter .72s cubic-bezier(.16,.92,.22,1) both}
        .bossImg.ws-boss-hit{animation:wsBossHit .68s cubic-bezier(.2,.82,.24,1) both}
        .bossImg.ws-boss-laugh{animation:wsBossLaugh .78s cubic-bezier(.2,.88,.22,1) both}
        .bossSide.ws-boss-hit-stage::after,.bossSide.ws-boss-laugh-stage::after{content:"";position:absolute;z-index:1;left:44%;bottom:80px;width:160px;height:160px;border-radius:50%;transform:translate(-50%,50%) scale(.68);pointer-events:none;opacity:0}
        .bossSide.ws-boss-hit-stage::after{background:radial-gradient(circle,rgba(255,105,95,.32),rgba(255,196,95,.11) 35%,transparent 70%);animation:wsBossHitPulse .7s ease-out both}
        .bossSide.ws-boss-laugh-stage::after{background:radial-gradient(circle,rgba(255,225,138,.33),rgba(121,217,199,.11) 36%,transparent 72%);animation:wsBossLaughPulse .8s ease-out both}
        @keyframes wsBossEnter{0%{opacity:0;transform:translateY(24px) scale(.82) rotate(-2deg);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35)) brightness(.78) saturate(.85)}48%{opacity:1;transform:translateY(-8px) scale(1.045) rotate(1deg);filter:drop-shadow(0 22px 18px rgba(0,0,0,.58)) drop-shadow(0 0 18px rgba(239,199,102,.28)) brightness(1.04)}72%{transform:translateY(3px) scale(.99) rotate(-.4deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
        @keyframes wsBossHit{0%{transform:translate(0,0) rotate(0) scale(1)}18%{transform:translate(-8px,4px) rotate(-5deg) scale(.96);filter:drop-shadow(0 18px 16px rgba(0,0,0,.58)) drop-shadow(0 0 20px rgba(255,104,88,.50)) brightness(.9)}40%{transform:translate(6px,-3px) rotate(3deg) scale(1.02)}62%{transform:translate(-4px,1px) rotate(-2deg) scale(.99)}82%{transform:translate(2px,-1px) rotate(1deg) scale(1.006)}100%{transform:translate(0,0) rotate(0) scale(1)}}
        @keyframes wsBossLaugh{0%{transform:translateY(0) rotate(0) scale(1)}20%{transform:translateY(-12px) rotate(3deg) scale(1.05);filter:drop-shadow(0 18px 16px rgba(0,0,0,.58)) drop-shadow(0 0 20px rgba(255,224,132,.44)) brightness(1.08)}42%{transform:translateY(1px) rotate(-3deg) scale(1.018)}64%{transform:translateY(-8px) rotate(2deg) scale(1.038)}84%{transform:translateY(-1px) rotate(-1deg) scale(1.012)}100%{transform:translateY(0) rotate(0) scale(1)}}
        @keyframes wsBossHitPulse{0%{opacity:0;transform:translate(-50%,50%) scale(.55)}28%{opacity:1;transform:translate(-50%,50%) scale(.92)}100%{opacity:0;transform:translate(-50%,50%) scale(1.18)}}
        @keyframes wsBossLaughPulse{0%{opacity:0;transform:translate(-50%,50%) scale(.62)}32%{opacity:1;transform:translate(-50%,50%) scale(1)}100%{opacity:0;transform:translate(-50%,50%) scale(1.16)}}
        @media(max-width:380px){.bossImg{width:138px!important;margin-left:-24px!important}}
        @media(prefers-reduced-motion:reduce){.bossImg.ws-boss-enter,.bossImg.ws-boss-hit,.bossImg.ws-boss-laugh,.bossSide.ws-boss-hit-stage::after,.bossSide.ws-boss-laugh-stage::after{animation-duration:.12s!important}}
      `;
      doc.head.appendChild(bossStyle);
    }

    if(!doc.getElementById('word-scramble-pause-button-style')){
      const pauseStyle=doc.createElement('style');
      pauseStyle.id='word-scramble-pause-button-style';
      pauseStyle.textContent=`
        #pause.ws-pause-button{position:relative!important;width:48px!important;height:48px!important;min-width:48px!important;padding:0!important;display:block!important;overflow:visible!important;border:1px solid rgba(255,216,111,.78)!important;background:radial-gradient(circle at 50% 30%,rgba(255,226,135,.11),transparent 46%),linear-gradient(160deg,rgba(5,57,88,.98),rgba(1,29,49,.98))!important;box-shadow:inset 0 1px rgba(255,255,255,.11),0 9px 20px rgba(0,12,25,.34)!important;font-size:0!important}
        #pause.ws-pause-button::before{content:'';position:absolute;left:50%;top:10px;width:18px;height:19px;transform:translateX(-50%);border-radius:2px;background:linear-gradient(90deg,#ffe18a 0 5px,transparent 5px 13px,#ffe18a 13px 18px);filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))}
        #pause.ws-pause-button::after{content:'PAUSE';position:absolute;left:50%;bottom:5px;transform:translateX(-50%);color:#c8e7e8;font-size:.34rem;font-weight:950;letter-spacing:.09em;line-height:1}
        #pause.ws-pause-button:active{transform:translateY(1px) scale(.97)}
      `;
      doc.head.appendChild(pauseStyle);
    }

    if(!doc.getElementById('word-scramble-settings-polish-style')){
      const settingsStyle=doc.createElement('style');
      settingsStyle.id='word-scramble-settings-polish-style';
      settingsStyle.textContent=`
        .settings{place-items:center!important;padding:18px!important;background:radial-gradient(circle at 50% 24%,rgba(29,116,150,.22),transparent 34%),rgba(0,12,24,.82)!important;-webkit-backdrop-filter:blur(11px) saturate(1.1);backdrop-filter:blur(11px) saturate(1.1)}
        .settings:not(.hidden) .sheet{animation:wsSettingsIn .24s cubic-bezier(.2,.86,.24,1) both}
        .settings .sheet{position:relative;width:min(470px,100%)!important;padding:25px 22px 20px!important;overflow:hidden;border:1px solid rgba(255,216,111,.88)!important;border-radius:28px!important;background:radial-gradient(circle at 88% 5%,rgba(69,226,205,.14),transparent 28%),radial-gradient(circle at 10% 100%,rgba(244,190,67,.12),transparent 34%),linear-gradient(150deg,rgba(5,58,91,.98),rgba(1,27,49,.99))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 5px rgba(1,21,39,.34),0 28px 70px rgba(0,5,15,.62),0 0 34px rgba(31,167,179,.09)!important}
        .settings .sheet::before{content:'⚓  ABENTEUER-MODUS';display:inline-flex;align-items:center;min-height:28px;padding:0 11px;margin-bottom:10px;border:1px solid rgba(239,199,102,.58);border-radius:999px;background:rgba(1,34,57,.78);color:#f3cc67;font-size:.56rem;font-weight:950;letter-spacing:.13em;box-shadow:inset 0 1px rgba(255,255,255,.08)}
        .settings .sheet::after{content:'';position:absolute;width:170px;height:170px;right:-78px;top:-92px;border-radius:50%;border:1px solid rgba(104,223,214,.13);box-shadow:0 0 45px rgba(104,223,214,.08);pointer-events:none}
        .settings .sheet h2{margin:0!important;color:#fff0bd!important;font:900 1.65rem/1 Georgia,serif!important;letter-spacing:.01em;text-shadow:0 4px 18px rgba(0,0,0,.38)}
        .settings .sheet h2::after{content:'Wähle, wie anspruchsvoll deine nächste Etappe wird.';display:block;max-width:36ch;margin-top:8px;color:#c8e7e8;font:700 .67rem/1.45 Inter,-apple-system,BlinkMacSystemFont,'SF Pro Rounded',system-ui,sans-serif;letter-spacing:0;text-shadow:none}
        .settings .diffs{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:9px!important;margin:18px 0 16px!important}
        .settings .diffs button{position:relative;min-height:104px!important;padding:13px 8px 10px!important;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid rgba(239,199,102,.42)!important;border-radius:19px!important;background:linear-gradient(165deg,rgba(7,54,83,.98),rgba(1,29,49,.98))!important;color:#fff0bd!important;box-shadow:inset 0 1px rgba(255,255,255,.08),0 10px 22px rgba(0,10,23,.32)!important;font-size:.82rem!important;font-weight:950!important;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
        .settings .diffs button::before{display:block;margin-bottom:2px;font-size:1.32rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
        .settings .diffs button::after{display:block;color:#9fcbd0;font-size:.5rem;font-weight:800;line-height:1.2;letter-spacing:.04em}
        .settings .diffs button[data-d='easy']::before{content:'🌴'}.settings .diffs button[data-d='easy']::after{content:'Locker lernen'}
        .settings .diffs button[data-d='medium']::before{content:'⚔️'}.settings .diffs button[data-d='medium']::after{content:'Mehr Tempo'}
        .settings .diffs button[data-d='hard']::before{content:'☠️'}.settings .diffs button[data-d='hard']::after{content:'Volle Prüfung'}
        .settings .diffs button.on{border-color:#fff0a7!important;background:linear-gradient(160deg,#ffe99a 0%,#efc75d 48%,#c98725 100%)!important;color:#082f4b!important;transform:translateY(-3px);box-shadow:inset 0 2px rgba(255,255,255,.55),0 5px 0 #70400f,0 15px 26px rgba(0,10,20,.36),0 0 22px rgba(255,211,90,.17)!important}
        .settings .diffs button.on::after{color:#315369!important}
        .settings .sheet>.secondary{width:100%!important;min-height:48px!important;border:1px solid rgba(239,199,102,.48)!important;border-radius:15px!important;background:rgba(1,30,50,.78)!important;color:#d9efea!important;font-size:.72rem!important;font-weight:900!important;box-shadow:inset 0 1px rgba(255,255,255,.07)!important}
        .settings .sheet>.secondary::before{content:'✕  ';color:#efc766}
        @keyframes wsSettingsIn{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
        @media(max-width:420px){.settings{padding:12px!important}.settings .sheet{padding:22px 15px 16px!important;border-radius:24px!important}.settings .diffs{gap:6px!important}.settings .diffs button{min-height:94px!important;padding:10px 4px 8px!important;font-size:.72rem!important}.settings .diffs button::before{font-size:1.18rem}.settings .diffs button::after{font-size:.45rem}}
      `;
      doc.head.appendChild(settingsStyle);
    }

    if(!doc.getElementById('word-scramble-letter-render-fix')){
      const patch=doc.createElement('script');
      patch.id='word-scramble-letter-render-fix';
      patch.textContent=`(()=>{
        const fixSelectedLetters=()=>{
          document.querySelectorAll('.slots .slot').forEach((slot,i)=>{
            const selected=s.sel[i];
            if(selected&&typeof selected==='object'&&typeof selected.l==='string'&&slot.textContent!==selected.l){slot.textContent=selected.l}
          });
        };

        const sparkleVectors=[[-70,-30,-22],[-58,-62,-12],[-34,-86,10],[-8,-98,-8],[22,-92,14],[48,-72,22],[68,-42,28],[-72,4,-18],[70,0,18],[-50,24,-10],[48,20,12],[2,-112,4]];
        let sparkleShownForCurrentSuccess=false;
        const showSuccessSparkles=()=>{
          const correct=Boolean(!s.boss&&s.feedback&&s.feedback.ok);
          if(!correct){sparkleShownForCurrentSuccess=false;return}
          if(sparkleShownForCurrentSuccess)return;
          const side=document.querySelector('.side:not(.bossSide)');
          if(!side)return;
          sparkleShownForCurrentSuccess=true;
          const layer=document.createElement('div');layer.className='ws-tula-sparkle-layer';layer.setAttribute('aria-hidden','true');
          sparkleVectors.forEach(([dx,dy,rot],i)=>{const sparkle=document.createElement('span');sparkle.className='ws-tula-sparkle';sparkle.textContent=i%3===1?'✧':'✦';sparkle.style.setProperty('--dx',dx+'px');sparkle.style.setProperty('--dy',dy+'px');sparkle.style.setProperty('--rot',rot+'deg');sparkle.style.color=['#ffe18a','#fff3d0','#79d9c7'][i%3];sparkle.style.fontSize=(10+(i%4)*2)+'px';sparkle.style.animationDelay=(i%4)*18+'ms';layer.appendChild(sparkle)});
          side.appendChild(layer);setTimeout(()=>layer.remove(),850);
        };

        const bossSprites=[
          'https://o-some.github.io/word-scramble/assets/bosses/level-01-pirat-kai.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-02-kapitaen-brax.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-03-blackfinn.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-04-alt-kapitaen-roderick.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-05-piratenbaron-vargas.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-06-kapitaen-ironhook.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-07-admiral-thorne.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-08-kartenmeister-corvin.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-09-schattenfuerst-azrak.webp?v=dbx-master-20260821',
          'https://o-some.github.io/word-scramble/assets/bosses/level-10-piratenkoenig-varkos.webp?v=dbx-master-20260821'
        ];
        const bossNames=['Pirat Kai','Kapitän Brax','Blackfinn','Alt-Kapitän Roderick','Piratenbaron Vargas','Kapitän Ironhook','Admiral Thorne','Kartenmeister Corvin','Schattenfürst Azrak','Piratenkönig Varkos'];
        let wsBossLevel=Math.max(1,Math.min(10,Number(sessionStorage.getItem('wordScrambleBossLevel')||1)));
        let wsWasBoss=Boolean(s.boss);
        let wsBossDefeated=false;
        let lastBossReaction='';

        const WS_BOSS_AFTER_WORDS=3;
        let wsBossTriggering=false;

        const syncBossTestJourney=()=>{
          if(s.boss)return;
          const journey=document.querySelector('.journey');
          if(!journey)return;
          const counter=journey.lastElementChild;
          if(counter&&counter.tagName==='B')counter.textContent=Math.min(s.normal,WS_BOSS_AFTER_WORDS)+'/'+WS_BOSS_AFTER_WORDS;
          const track=journey.querySelector('.track');
          if(track)track.style.setProperty('--p',Math.min(100,(s.normal/WS_BOSS_AFTER_WORDS)*100)+'%');
        };

        const syncBossTestTrigger=()=>{
          if(s.boss||s.lives<=0||s.normal<WS_BOSS_AFTER_WORDS||s.feedback){
            if(!s.boss)wsBossTriggering=false;
            return;
          }
          if(wsBossTriggering)return;
          wsBossTriggering=true;
          s.boss=true;
          s.bossHp=3;
          s.bossMiss=0;
          s.feedback=null;
          setup();
        };

        const polishPauseButton=()=>{
          const pauseButton=document.getElementById('pause');
          if(!pauseButton)return;
          pauseButton.classList.add('ws-pause-button');
          pauseButton.textContent='';
          pauseButton.setAttribute('aria-label','Spiel pausieren');
          pauseButton.setAttribute('title','Pause');
        };

        const syncBossProgress=()=>{
          const nowBoss=Boolean(s.boss);
          if(nowBoss&&typeof s.bossHp==='number'&&s.bossHp<=0)wsBossDefeated=true;
          if(wsWasBoss&&!nowBoss){
            if(wsBossDefeated){wsBossLevel=wsBossLevel>=10?1:wsBossLevel+1;sessionStorage.setItem('wordScrambleBossLevel',String(wsBossLevel))}
            wsBossDefeated=false;
          }
          wsWasBoss=nowBoss;
        };

        const syncBossSprite=()=>{
          if(!s.boss)return;
          const img=document.querySelector('.bossImg');
          if(!img)return;
          const desired=bossSprites[wsBossLevel-1];
          const plate=document.querySelector('.bossPlate');
          if(plate)plate.textContent='LEVEL '+wsBossLevel+' · '+bossNames[wsBossLevel-1].toUpperCase();
          img.alt=bossNames[wsBossLevel-1];img.loading='eager';img.decoding='async';
          if(img.dataset.wsBossSprite!==desired){
            img.dataset.wsBossSprite=desired;
            img.onerror=()=>{img.onerror=null;img.classList.add('ws-boss-load-error')};
            img.src=desired;
            img.classList.remove('ws-boss-enter','ws-boss-load-error');void img.offsetWidth;img.classList.add('ws-boss-enter');
          }
        };

        const syncBossReaction=()=>{
          const img=document.querySelector('.bossImg');const side=document.querySelector('.bossSide');
          if(!s.boss||!img||!side||!s.feedback){lastBossReaction='';if(img)img.classList.remove('ws-boss-hit','ws-boss-laugh');if(side)side.classList.remove('ws-boss-hit-stage','ws-boss-laugh-stage');return}
          const reaction=s.feedback.ok?'hit':'laugh';if(reaction===lastBossReaction)return;lastBossReaction=reaction;
          img.classList.remove('ws-boss-hit','ws-boss-laugh');side.classList.remove('ws-boss-hit-stage','ws-boss-laugh-stage');void img.offsetWidth;
          if(reaction==='hit'){img.classList.add('ws-boss-hit');side.classList.add('ws-boss-hit-stage')}else{img.classList.add('ws-boss-laugh');side.classList.add('ws-boss-laugh-stage')}
          setTimeout(()=>{img.classList.remove('ws-boss-hit','ws-boss-laugh');side.classList.remove('ws-boss-hit-stage','ws-boss-laugh-stage')},850);
        };

        const applyWordScramblePatches=()=>{fixSelectedLetters();showSuccessSparkles();polishPauseButton();syncBossProgress();syncBossTestJourney();syncBossTestTrigger();syncBossSprite();syncBossReaction()};
        const target=document.getElementById('game');
        if(target)new MutationObserver(applyWordScramblePatches).observe(target,{childList:true,subtree:true});
        applyWordScramblePatches();
      })();`;
      doc.documentElement.appendChild(patch);
    }
  }catch(err){console.error('Word Scramble patch failed',err)}
});
</script>
</body>
</html>
