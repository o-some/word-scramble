<script>
const WORDS=[['Tisch','TABLE'],['müde','TIRED'],['blau','BLUE'],['tanzen','DANCE'],['Insel','ISLAND'],['Schule','SCHOOL'],['Freund','FRIEND'],['Wasser','WATER'],['Reise','TRAVEL'],['Garten','GARDEN'],['Familie','FAMILY'],['Flughafen','AIRPORT'],['Abenteuer','ADVENTURE'],['Schildkröte','TURTLE'],['Schatz','TREASURE'],['Piraten','PIRATES'],['Kapitän','CAPTAIN'],['Muschel','SHELL'],['Hafen','HARBOR'],['Karte','MAP'],['Bibliothek','LIBRARY'],['Frühstück','BREAKFAST'],['Schmetterling','BUTTERFLY'],['Erinnerung','MEMORY'],['Sonnenuntergang','SUNSET']];
const BOSSES=[
{name:'Pirat Kai',taunt:'Na los, Inselkröte – zeig mir deinen ersten Sieg!',img:'assets/bosses/level-01-pirat-kai.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/home_tropical_bay.webp',accent:'#ffd071'},
{name:'Kapitän Brax',taunt:'Jetzt wird es rauer – bleib auf Kurs!',img:'assets/bosses/level-02-kapitaen-brax.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/mode_listening_adventure.webp',accent:'#f3b65f'},
{name:'Blackfinn',taunt:'Kein Wort entkommt meinen Augen.',img:'assets/bosses/level-03-blackfinn.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/mode_stories.webp',accent:'#e7bb7b'},
{name:'Alt-Kapitän Roderick',taunt:'Erfahrung schlägt Übermut, Landkrabbe.',img:'assets/bosses/level-04-alt-kapitaen-roderick.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/map_turtle_island_overview.webp',accent:'#ffe5a0'},
{name:'Piratenbaron Vargas',taunt:'Mein Revier, meine Regeln.',img:'assets/bosses/level-05-piratenbaron-vargas.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/home_tula_house_interior.webp',accent:'#c6a2ff'},
{name:'Kapitän Ironhook',taunt:'An meinem Haken kommst du nicht vorbei!',img:'assets/bosses/level-06-kapitaen-ironhook.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/mode_golden_minute.webp',accent:'#ffb46c'},
{name:'Admiral Thorne',taunt:'Disziplin, Rekrut. Zeig mir Präzision.',img:'assets/bosses/level-07-admiral-thorne.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/mode_speech_trainer.webp',accent:'#d7ef8d'},
{name:'Kartenmeister Corvin',taunt:'Kennst du den Weg – und das richtige Wort?',img:'assets/bosses/level-08-kartenmeister-corvin.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/mode_words_discover.webp',accent:'#ffd76c'},
{name:'Schattenfürst Azrak',taunt:'Ein Fehler – und die Schatten lachen.',img:'assets/bosses/level-09-schattenfuerst-azrak.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/mode_memory.webp',accent:'#b27cff'},
{name:'Piratenkönig Varkos',taunt:'Der letzte Thron gehört nur dem Besten.',img:'assets/bosses/level-10-piratenkoenig-varkos.webp',scene:'https://o-some.github.io/tulasisland/assets/creative/home_tropical_bay.webp',accent:'#ffcb68'}
];
const TULA={waving:'https://o-some.github.io/tulasisland/assets/creative/tula_waving.webp',celebrating:'https://o-some.github.io/tulasisland/assets/creative/tula_celebrating.webp',surprised:'https://o-some.github.io/tulasisland/assets/creative/tula_surprised.webp'};
const BOSS_WORDS=['PIRATE','CAPTAIN','HARBOR','TREASURE','ADVENTURE','ISLAND','COMPASS','ANCHOR','VOYAGE','KINGDOM'];
const $=s=>document.querySelector(s),game=$('#game'),app=$('#app');
let state={i:0,score:0,combo:0,lives:3,shells:0,diff:'easy',normal:0,boss:false,bossIndex:0,bossHp:3,bossMiss:0,bossRound:1,selected:[],tiles:[],feedback:null,locked:false};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function difficultyLabel(){return state.diff==='easy'?'Leicht':state.diff==='medium'?'Mittel':'Schwer'}
function currentWord(){let pool=WORDS;if(state.diff==='easy')pool=WORDS.filter(x=>x[1].length<=6);if(state.diff==='medium')pool=WORDS.filter(x=>x[1].length>=5&&x[1].length<=9);if(state.diff==='hard')pool=WORDS.filter(x=>x[1].length>=8);return pool[state.i%pool.length]||WORDS[state.i%WORDS.length]}
function answer(){return state.boss?BOSS_WORDS[state.bossIndex%BOSS_WORDS.length]:currentWord()[1].toUpperCase()}
function promptWord(){return state.boss?'Boss-Scramble':currentWord()[0]}
function hearts(n){return'♥'.repeat(Math.max(0,n))+'♡'.repeat(Math.max(0,3-n))}
function boss(){return BOSSES[state.bossIndex%BOSSES.length]}
function setup(){state.selected=[];state.tiles=shuffle([...answer()]);state.locked=false;render()}
function sceneVars(){const b=boss();const image=state.boss?b.scene:b.scene;document.documentElement.style.setProperty('--sceneImage',`url('${image}')`);document.documentElement.style.setProperty('--accentSoft',b.accent+'33');document.documentElement.style.setProperty('--bright',state.boss?'.78':'.9');document.documentElement.style.setProperty('--sat',state.boss?'1.18':'1.08')}
function feedbackTula(){if(!state.feedback)return'';return`<div class="feedback ${state.feedback.ok?'':'bad'}"><b>${state.feedback.ok?'Richtig!':'Noch nicht.'}</b>${state.feedback.msg}</div>`}
function feedbackBoss(){if(!state.feedback)return'';return`<div class="bossFeedback ${!state.feedback.ok?'goodForBoss':''}"><b>${state.feedback.ok?'Treffer!':'Ha! Ha!'}</b><br>${state.feedback.msg}</div>`}
function sideMarkup(){if(state.boss){const b=boss();const cls=state.feedback?(state.feedback.ok?'hurt':'happy'):'';return`<aside class="side bossSide">${feedbackBoss()}<div class="bossPlate">LEVEL ${state.bossIndex+1} · ${b.name}</div><div class="sparkles ${state.feedback&&!state.feedback.ok?'on':''}"></div><img class="bossImg ${cls}" src="${b.img}" alt="${b.name}"><div class="bossBubble">${b.taunt}</div></aside>`}const mood=state.feedback?(state.feedback.ok?'correct':'wrong'):'';const src=state.feedback?(state.feedback.ok?TULA.celebrating:TULA.surprised):TULA.waving;return`<aside class="side">${feedbackTula()}<div class="tulaStage"><div class="sparkles ${state.feedback&&state.feedback.ok?'on':''}"></div><img class="tula ${mood}" src="${src}" alt="Tula"></div><div class="bubble">${state.feedback?(state.feedback.ok?'Super!':'Fast!'):'Los geht’s!'}</div></aside>`}
function render(){sceneVars();$('#score').textContent=state.score.toLocaleString('de-DE');$('#combo').textContent='x'+state.combo;$('#lives').textContent=hearts(state.lives);$('#shells').textContent=state.shells;$('#difficultyLabel').textContent=difficultyLabel();$('#langline').textContent='DE → EN · '+state.diff.toUpperCase();const a=answer();const progress=Math.min(100,state.normal/10*100);game.innerHTML=`<section class="game"><section class="card"><div class="eyebrow"><span>${state.boss?`BOSS · RUNDE ${state.bossRound}/5`:'DE → EN · '+state.diff.toUpperCase()}</span><span class="badge">${state.boss?boss().name:'TULA’S ISLAND'}</span></div>${state.boss?`<div class="bossHp"><span>BOSS-LEBEN</span><b>${hearts(state.bossHp)}</b></div>`:''}<div class="prompt"><h1>${promptWord()}</h1><p>${state.boss?'Setze das Bosswort zusammen. Ein Tipp setzt nur den nächsten richtigen Buchstaben – das Lösungswort bleibt verborgen.':'Setze die richtige Übersetzung auf Englisch zusammen.'}</p></div><span class="label">DEIN WORT</span><div class="slots" style="--n:${a.length}">${[...a].map((_,i)=>{const sel=state.selected[i];return`<div class="slot ${sel?'filled':''}">${sel?sel.letter:''}</div>`}).join('')}</div><span class="label" style="margin-top:18px">BUCHSTABEN</span><div class="tiles" style="--n:${a.length}">${state.tiles.map((letter,i)=>`<button class="tile ${state.selected.some(x=>x.index===i)?'used':''}" data-i="${i}" ${state.locked?'disabled':''}>${letter}</button>`).join('')}</div><div class="actions"><button class="tool" id="undo" ${state.locked?'disabled':''}>↶<br>Zurück</button><button class="tool" id="clear" ${state.locked?'disabled':''}>⌫<br>Löschen</button><button class="tool" id="hint" ${state.locked?'disabled':''}>💡<br>Tipp</button><button class="check" id="check" ${state.locked?'disabled':''}>Prüfen ✓</button></div></section>${sideMarkup()}<section class="journey"><div><small>INSELPFAD · LEVEL ${state.bossIndex+1}</small><br><b>${state.boss?boss().name:'Zum Boss: '+boss().name}</b></div><div class="track" style="--p:${state.boss?100:progress}%"><i></i></div><b>${state.boss?`${state.bossHp}/3 HP`:`${state.normal}/10`}</b></section></section>`;bind()}
function bind(){document.querySelectorAll('.tile').forEach(btn=>btn.onclick=()=>{if(state.locked)return;const idx=+btn.dataset.i;if(state.selected.length<answer().length&&!state.selected.some(x=>x.index===idx)){state.selected.push({index:idx,letter:state.tiles[idx]});render()}});$('#undo').onclick=()=>{if(state.locked)return;state.selected.pop();render()};$('#clear').onclick=()=>{if(state.locked)return;state.selected=[];render()};$('#hint').onclick=()=>{if(state.locked)return;const a=answer(),pos=state.selected.length;if(pos>=a.length)return;const prefixOk=state.selected.every((x,i)=>x.letter===a[i]);if(!prefixOk)state.selected=[];const p=state.selected.length,needed=a[p];const idx=state.tiles.findIndex((x,i)=>x===needed&&!state.selected.some(v=>v.index===i));if(idx>=0)state.selected.push({index:idx,letter:state.tiles[idx]});render()};$('#check').onclick=check}
function check(){if(state.locked)return;const a=answer(),value=state.selected.map(x=>x.letter).join('');if(value.length!==a.length)return;state.locked=true;const ok=value===a;state.feedback={ok,msg:ok?'Sauber gelöst.':'Richtig wäre: '+a};if(!ok){app.classList.add('shake','flashWrong');setTimeout(()=>app.classList.remove('shake','flashWrong'),420)}if(state.boss){if(ok){state.bossHp=Math.max(0,state.bossHp-1);state.score+=180;state.shells++;state.combo++}else{state.bossMiss++;state.combo=0}render();setTimeout(()=>{const won=state.bossHp<=0,lost=state.bossMiss>=3;if(won||lost){state.boss=false;state.normal=0;state.bossHp=3;state.bossMiss=0;state.bossRound=1;if(won)state.bossIndex=(state.bossIndex+1)%BOSSES.length;state.i++}else{state.bossRound++;}state.feedback=null;setup()},1150)}else{if(ok){state.score+=100;state.shells++;state.combo++}else{state.lives=Math.max(0,state.lives-1);state.combo=0}state.normal++;render();setTimeout(()=>{if(state.lives<=0){state.lives=3;state.score=0;state.combo=0;state.normal=0}else if(state.normal>=10){state.boss=true;state.bossHp=3;state.bossMiss=0;state.bossRound=1}else state.i++;state.feedback=null;setup()},1050)}}
$('#level').onclick=()=>{$('#settings').classList.remove('hidden');document.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('on',b.dataset.d===state.diff))};$('#closeSettings').onclick=()=>$('#settings').classList.add('hidden');document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.diff=b.dataset.d;$('#settings').classList.add('hidden');state.i++;setup()});$('#pause').onclick=()=>$('#pauseModal').classList.remove('hidden');$('#resume').onclick=()=>$('#pauseModal').classList.add('hidden');$('#endGame').onclick=()=>location.href='https://o-some.github.io/tulasisland/';$('#exit').onclick=()=>location.href='https://o-some.github.io/tulasisland/';
setup();
</script>
</body>
</html>
