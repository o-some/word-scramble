<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#032f50">
<meta name="description" content="Word Scramble – Sprachlernspiel aus Tula’s Island">
<title>Word Scramble · Tula’s Island</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#032f50}iframe{display:block;width:100%;height:100%;border:0;background:#032f50}
</style>
</head>
<body>
<iframe id="game" title="Word Scramble" allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
(async()=>{
  'use strict';
  const RELEASE='20260823-runtime-v10';
  window.__WS_RUNTIME_RELEASE__=RELEASE;
  const frame=document.getElementById('game');
  const load=(id,src)=>new Promise((resolve,reject)=>{
    if(document.getElementById(id))return resolve();
    const script=document.createElement('script');
    script.id=id;
    script.src=src+'?v='+encodeURIComponent(RELEASE);
    script.dataset.wsRelease=RELEASE;
    script.onload=()=>resolve();
    script.onerror=()=>reject(new Error('Runtime-Modul konnte nicht geladen werden: '+src));
    document.head.appendChild(script);
  });
  frame.src='./runtime/base.html?v='+encodeURIComponent(RELEASE);
  for(const [id,src] of [
    ['ws-roadmap-entry','./assets/patches/boss-roadmap-v1.js'],
    ['ws-progression-entry','./assets/patches/boss-progression-core.js'],
    ['ws-intro-lifecycle-entry','./assets/patches/boss-intro-lifecycle-bridge.js'],
    ['ws-runtime-composition-entry','./assets/runtime-composition.js']
  ]) await load(id,src);
})().catch(err=>{
  console.error('Word Scramble boot failed',err);
  const box=document.createElement('div');
  box.style.cssText='position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:24px;background:#032f50;color:#fff0bd;font:700 16px/1.4 system-ui;text-align:center';
  box.textContent='Word Scramble konnte nicht vollständig gestartet werden. Bitte neu laden.';
  document.body.appendChild(box);
});
</script>
</body>
</html>
