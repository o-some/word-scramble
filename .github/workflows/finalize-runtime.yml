name: Validate Word Scramble runtime source

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'runtime/**'
      - 'assets/patches/**'
      - 'tests/runtime-contract.mjs'
      - '.github/workflows/finalize-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
      - name: Verify authoritative local runtime contracts
        run: node tests/runtime-contract.mjs
      - name: Verify boss assets exist
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            assets/bosses/level-01-pirat-kai.webp \
            assets/bosses/level-02-kapitaen-brax.webp \
            assets/bosses/level-03-blackfinn.webp \
            assets/bosses/level-04-alt-kapitaen-roderick.webp \
            assets/bosses/level-05-piratenbaron-vargas.webp \
            assets/bosses/level-06-kapitaen-ironhook.webp \
            assets/bosses/level-07-admiral-thorne.webp \
            assets/bosses/level-08-kartenmeister-corvin.webp \
            assets/bosses/level-09-schattenfuerst-azrak.webp \
            assets/bosses/level-10-piratenkoenig-varkos.webp; do
              test -s "$file"
              file "$file" | grep -qi 'webp'
          done
