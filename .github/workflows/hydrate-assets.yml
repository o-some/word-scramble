name: Hydrate Word Scramble boss assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hydrate-assets.yml'
      - 'ASSET_HYDRATE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download migration-staged boss sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/bosses
          SOURCE='https://raw.githubusercontent.com/o-some/tulasisland/migration/word-scramble-assets-20260819/migration-assets/word-scramble/blobs'
          curl --fail --location --retry 3 "$SOURCE/asset-01.webp" -o assets/bosses/level-01-pirat-kai.webp
          curl --fail --location --retry 3 "$SOURCE/asset-02.webp" -o assets/bosses/level-02-kapitaen-brax.webp
          curl --fail --location --retry 3 "$SOURCE/asset-03.webp" -o assets/bosses/level-03-blackfinn.webp
          curl --fail --location --retry 3 "$SOURCE/asset-04.webp" -o assets/bosses/level-04-alt-kapitaen-roderick.webp
          curl --fail --location --retry 3 "$SOURCE/asset-05.webp" -o assets/bosses/level-05-piratenbaron-vargas.webp
          curl --fail --location --retry 3 "$SOURCE/asset-06.webp" -o assets/bosses/level-06-kapitaen-ironhook.webp
          curl --fail --location --retry 3 "$SOURCE/asset-07.webp" -o assets/bosses/level-07-admiral-thorne.webp
          for file in assets/bosses/level-0{1..7}-*.webp; do
            test -s "$file"
            file "$file" | grep -qi 'webp'
          done

      - name: Commit hydrated runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bosses
          if git diff --cached --quiet; then
            echo 'Boss assets already hydrated.'
            exit 0
          fi
          git commit -m 'Add Word Scramble boss sprites 1-7'
          git push origin HEAD:main
