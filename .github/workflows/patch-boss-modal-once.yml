name: Patch Word Scramble boss and modal once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'BOSS_MODAL_PATCH_TRIGGER'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply targeted boss and difficulty modal patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          # 1) Boss assets: force fresh, validated local assets on all ten levels.
          for name in [
            'level-01-pirat-kai.webp','level-02-kapitaen-brax.webp','level-03-blackfinn.webp',
            'level-04-alt-kapitaen-roderick.webp','level-05-piratenbaron-vargas.webp',
            'level-06-kapitaen-ironhook.webp','level-07-admiral-thorne.webp',
            'level-08-kartenmeister-corvin.webp','level-09-schattenfuerst-azrak.webp',
            'level-10-piratenkoenig-varkos.webp'
          ]:
              old=f'https://o-some.github.io/word-scramble/assets/bosses/{name}'
              new=old+'?v=dbx-master-20260821'
              text=text.replace(old,new)

          old_sync="""        const syncBossSprite=()=>{
          if(!s.boss)return;
          const img=document.querySelector('.bossImg');
          if(!img)return;
          const level=getBossLevel();
          const desired=bossSprites[level-1];
          if(!img.dataset.wsOriginalSrc){
            img.dataset.wsOriginalSrc=img.getAttribute('src')||'';
          }
          img.alt=bossNames[level-1];
          img.loading='eager';
          img.decoding='async';

          if(level===1){
            img.dataset.wsBossSprite='original-level-1';
            img.onerror=null;
          }else if(img.dataset.wsBossSprite!==desired){
            const original=img.dataset.wsOriginalSrc;
            img.dataset.wsBossSprite=desired;
            img.onerror=()=>{
              if(original&&img.getAttribute('src')!==original){
                img.onerror=null;
                img.dataset.wsBossSprite='fallback-original';
                img.src=original;
              }
            };
            img.src=desired;
          }

          if(!img.classList.contains('ws-boss-enter')){
            img.classList.remove('ws-boss-enter');
            void img.offsetWidth;
            img.classList.add('ws-boss-enter');
          }
        };
"""
          new_sync="""        let wsBossLevel=Math.max(1,Math.min(10,Number(sessionStorage.getItem('wordScrambleBossLevel')||1)));
        let wsWasBoss=Boolean(s.boss);

        const syncBossProgress=()=>{
          const nowBoss=Boolean(s.boss);
          if(wsWasBoss&&!nowBoss){
            wsBossLevel=wsBossLevel>=10?1:wsBossLevel+1;
            sessionStorage.setItem('wordScrambleBossLevel',String(wsBossLevel));
          }
          wsWasBoss=nowBoss;
        };

        const syncBossSprite=()=>{
          if(!s.boss)return;
          const img=document.querySelector('.bossImg');
          if(!img)return;
          const level=wsBossLevel;
          const desired=bossSprites[level-1];
          const plate=document.querySelector('.bossPlate');
          if(plate)plate.textContent='LEVEL '+level+' · '+bossNames[level-1].toUpperCase();
          img.alt=bossNames[level-1];
          img.loading='eager';
          img.decoding='async';

          if(img.dataset.wsBossSprite!==desired){
            img.dataset.wsBossSprite=desired;
            img.onerror=()=>{
              img.onerror=null;
              img.classList.add('ws-boss-load-error');
            };
            img.src=desired;
            img.classList.remove('ws-boss-enter','ws-boss-load-error');
            void img.offsetWidth;
            img.classList.add('ws-boss-enter');
          }
        };
"""
          if text.count(old_sync)!=1:
              raise SystemExit(f'Boss sync block mismatch: {text.count(old_sync)}')
          text=text.replace(old_sync,new_sync,1)

          text=text.replace(
              "          showSuccessSparkles();\n          syncBossSprite();",
              "          showSuccessSparkles();\n          syncBossProgress();\n          syncBossSprite();",
              1
          )

          # 2) Boss-only presentation polish. No layout/gameplay changes outside boss side.
          text=text.replace(
              "          width:132px!important;\n          max-width:150%!important;",
              "          width:146px!important;\n          max-width:none!important;\n          margin-left:-16px!important;\n          position:relative!important;\n          z-index:5!important;",
              1
          )
          text=text.replace(
              "        .bossImg.ws-boss-enter{animation:wsBossEnter .62s cubic-bezier(.18,.86,.24,1) both}",
              "        .bossImg.ws-boss-enter{animation:wsBossEnter .72s cubic-bezier(.16,.92,.22,1) both}",
              1
          )
          text=text.replace(
              "          0%{opacity:0;transform:translateY(18px) scale(.88);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35)) brightness(.88)}\n          65%{opacity:1;transform:translateY(-4px) scale(1.025)}\n          100%{opacity:1;transform:translateY(0) scale(1)}",
              "          0%{opacity:0;transform:translateY(24px) scale(.82) rotate(-2deg);filter:drop-shadow(0 8px 10px rgba(0,0,0,.35)) brightness(.78) saturate(.85)}\n          48%{opacity:1;transform:translateY(-8px) scale(1.045) rotate(1deg);filter:drop-shadow(0 22px 18px rgba(0,0,0,.58)) drop-shadow(0 0 18px rgba(239,199,102,.28)) brightness(1.04)}\n          72%{transform:translateY(3px) scale(.99) rotate(-.4deg)}\n          100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}",
              1
          )

          # 3) Difficulty modal: CSS only; existing click/state logic remains untouched.
          modal_style="""

    if(!doc.getElementById('word-scramble-settings-polish-style')){
      const settingsStyle=doc.createElement('style');
      settingsStyle.id='word-scramble-settings-polish-style';
      settingsStyle.textContent=`
        .settings{
          place-items:center!important;
          padding:18px!important;
          background:radial-gradient(circle at 50% 24%,rgba(29,116,150,.22),transparent 34%),rgba(0,12,24,.82)!important;
          -webkit-backdrop-filter:blur(11px) saturate(1.1);
          backdrop-filter:blur(11px) saturate(1.1);
        }
        .settings .sheet{
          position:relative;
          width:min(470px,100%)!important;
          padding:25px 22px 20px!important;
          overflow:hidden;
          border:1px solid rgba(255,216,111,.88)!important;
          border-radius:28px!important;
          background:
            radial-gradient(circle at 88% 5%,rgba(69,226,205,.14),transparent 28%),
            radial-gradient(circle at 10% 100%,rgba(244,190,67,.12),transparent 34%),
            linear-gradient(150deg,rgba(5,58,91,.98),rgba(1,27,49,.99))!important;
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,.14),
            inset 0 0 0 5px rgba(1,21,39,.34),
            0 28px 70px rgba(0,5,15,.62),
            0 0 34px rgba(31,167,179,.09)!important;
        }
        .settings .sheet::before{
          content:'⚓  ABENTEUER-MODUS';
          display:inline-flex;
          align-items:center;
          min-height:28px;
          padding:0 11px;
          margin-bottom:10px;
          border:1px solid rgba(239,199,102,.58);
          border-radius:999px;
          background:rgba(1,34,57,.78);
          color:#f3cc67;
          font-size:.56rem;
          font-weight:950;
          letter-spacing:.13em;
          box-shadow:inset 0 1px rgba(255,255,255,.08);
        }
        .settings .sheet::after{
          content:'';
          position:absolute;
          width:170px;height:170px;
          right:-78px;top:-92px;
          border-radius:50%;
          border:1px solid rgba(104,223,214,.13);
          box-shadow:0 0 45px rgba(104,223,214,.08);
          pointer-events:none;
        }
        .settings .sheet h2{
          margin:0!important;
          color:#fff0bd!important;
          font:900 1.65rem/1 Georgia,serif!important;
          letter-spacing:.01em;
          text-shadow:0 4px 18px rgba(0,0,0,.38);
        }
        .settings .sheet h2::after{
          content:'Wähle, wie anspruchsvoll deine nächste Etappe wird.';
          display:block;
          max-width:36ch;
          margin-top:8px;
          color:#c8e7e8;
          font:700 .67rem/1.45 Inter,-apple-system,BlinkMacSystemFont,'SF Pro Rounded',system-ui,sans-serif;
          letter-spacing:0;
          text-shadow:none;
        }
        .settings .diffs{
          grid-template-columns:repeat(3,minmax(0,1fr))!important;
          gap:9px!important;
          margin:18px 0 16px!important;
        }
        .settings .diffs button{
          position:relative;
          min-height:104px!important;
          padding:13px 8px 10px!important;
          display:flex!important;
          flex-direction:column;
          align-items:center;
          justify-content:center;
          gap:4px;
          border:1px solid rgba(239,199,102,.42)!important;
          border-radius:19px!important;
          background:linear-gradient(165deg,rgba(7,54,83,.98),rgba(1,29,49,.98))!important;
          color:#fff0bd!important;
          box-shadow:inset 0 1px rgba(255,255,255,.08),0 10px 22px rgba(0,10,23,.32)!important;
          font-size:.82rem!important;
          font-weight:950!important;
          transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
        }
        .settings .diffs button::before{
          display:block;
          margin-bottom:2px;
          font-size:1.32rem;
          line-height:1;
          filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));
        }
        .settings .diffs button::after{
          display:block;
          color:#9fcbd0;
          font-size:.5rem;
          font-weight:800;
          line-height:1.2;
          letter-spacing:.04em;
        }
        .settings .diffs button[data-d='easy']::before{content:'🌴'}
        .settings .diffs button[data-d='easy']::after{content:'Locker lernen'}
        .settings .diffs button[data-d='medium']::before{content:'⚔️'}
        .settings .diffs button[data-d='medium']::after{content:'Mehr Tempo'}
        .settings .diffs button[data-d='hard']::before{content:'☠️'}
        .settings .diffs button[data-d='hard']::after{content:'Volle Prüfung'}
        .settings .diffs button.on{
          border-color:#fff0a7!important;
          background:linear-gradient(160deg,#ffe99a 0%,#efc75d 48%,#c98725 100%)!important;
          color:#082f4b!important;
          transform:translateY(-3px);
          box-shadow:inset 0 2px rgba(255,255,255,.55),0 5px 0 #70400f,0 15px 26px rgba(0,10,20,.36),0 0 22px rgba(255,211,90,.17)!important;
        }
        .settings .diffs button.on::after{color:#315369!important}
        .settings .sheet > .secondary{
          width:100%!important;
          min-height:48px!important;
          border:1px solid rgba(239,199,102,.48)!important;
          border-radius:15px!important;
          background:rgba(1,30,50,.78)!important;
          color:#d9efea!important;
          font-size:.72rem!important;
          font-weight:900!important;
          box-shadow:inset 0 1px rgba(255,255,255,.07)!important;
        }
        .settings .sheet > .secondary::before{content:'✕  ';color:#efc766}
        @media(max-width:420px){
          .settings{padding:12px!important}
          .settings .sheet{padding:22px 15px 16px!important;border-radius:24px!important}
          .settings .diffs{gap:6px!important}
          .settings .diffs button{min-height:94px!important;padding:10px 4px 8px!important;font-size:.72rem!important}
          .settings .diffs button::before{font-size:1.18rem}
          .settings .diffs button::after{font-size:.45rem}
        }
      `;
      doc.head.appendChild(settingsStyle);
    }
"""
          anchor="""    if(!doc.getElementById('word-scramble-letter-render-fix')){"""
          if text.count(anchor)!=1:
              raise SystemExit('Could not find settings injection anchor')
          text=text.replace(anchor,modal_style+'\n'+anchor,1)

          p.write_text(text,encoding='utf-8')
          PY

          # Targeted checks only.
          grep -q "word-scramble-settings-polish-style" index.html
          grep -q "dbx-master-20260821" index.html
          grep -q "syncBossProgress" index.html
          if grep -q "if(level===1)" index.html; then
            echo 'Old Level 1 exception still present' >&2
            exit 1
          fi
          git diff --check

      - name: Commit only the targeted runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f BOSS_MODAL_PATCH_TRIGGER .github/workflows/patch-boss-modal-once.yml
          git add index.html BOSS_MODAL_PATCH_TRIGGER .github/workflows/patch-boss-modal-once.yml
          git commit -m 'Fix boss sprites and polish difficulty modal'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
