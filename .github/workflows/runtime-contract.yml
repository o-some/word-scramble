name: Runtime contract checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify runtime source of truth
        run: node tests/runtime-contract.mjs
      - name: Verify critical patch syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            assets/patches/boss-progression-core.js \
            assets/patches/boss-abilities-1-3.js \
            assets/patches/variable-boss-words.js \
            assets/patches/boss-abilities-4-6.js \
            assets/patches/boss-abilities-7-10.js \
            assets/patches/word-rarities.js \
            assets/patches/boss-ux-final-regression.js; do
              node --check "$file"
          done
      - name: Run cold-start browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/word-scramble-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/tests/browser-smoke.html >/dev/null; then break; fi
            sleep 0.2
          done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom http://127.0.0.1:4173/tests/browser-smoke.html > /tmp/word-scramble-smoke.html
          cat /tmp/word-scramble-smoke.html
          grep -q 'data-status="pass"' /tmp/word-scramble-smoke.html
