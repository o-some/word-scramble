name: Patch pause and boss trigger once

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'PAUSE_BOSS3_PATCH_TRIGGER'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply targeted pause and boss trigger patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          # A) Pause button presentation only.
          anchor="    if(!doc.getElementById('word-scramble-settings-polish-style')){"
          pause_style="""    if(!doc.getElementById('word-scramble-pause-button-style')){
      const pauseStyle=doc.createElement('style');
      pauseStyle.id='word-scramble-pause-button-style';
      pauseStyle.textContent=`
        #pause.ws-pause-button{position:relative!important;width:48px!important;height:48px!important;min-width:48px!important;padding:0!important;display:block!important;overflow:visible!important;border:1px solid rgba(255,216,111,.78)!important;background:radial-gradient(circle at 50% 30%,rgba(255,226,135,.11),transparent 46%),linear-gradient(160deg,rgba(5,57,88,.98),rgba(1,29,49,.98))!important;box-shadow:inset 0 1px rgba(255,255,255,.11),0 9px 20px rgba(0,12,25,.34)!important;font-size:0!important}
        #pause.ws-pause-button::before{content:'';position:absolute;left:50%;top:10px;width:18px;height:19px;transform:translateX(-50%);border-radius:2px;background:linear-gradient(90deg,#ffe18a 0 5px,transparent 5px 13px,#ffe18a 13px 18px);filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))}
        #pause.ws-pause-button::after{content:'PAUSE';position:absolute;left:50%;bottom:5px;transform:translateX(-50%);color:#c8e7e8;font-size:.34rem;font-weight:950;letter-spacing:.09em;line-height:1}
        #pause.ws-pause-button:active{transform:translateY(1px) scale(.97)}
      `;
      doc.head.appendChild(pauseStyle);
    }

"""
          if text.count(anchor)!=1:
              raise SystemExit('Pause style anchor mismatch')
          text=text.replace(anchor,pause_style+anchor,1)

          # B) Boss test trigger. Do not replace check(), scoring or lives logic.
          state_anchor="        let lastBossReaction='';"
          trigger_logic="""        const WS_BOSS_AFTER_WORDS=3;
        let wsBossTriggering=false;

        const syncBossTestJourney=()=>{
          if(s.boss)return;
          const journey=document.querySelector('.journey');
          if(!journey)return;
          const counter=journey.lastElementChild;
          if(counter&&counter.tagName==='B')counter.textContent=Math.min(s.normal,WS_BOSS_AFTER_WORDS)+'/'+WS_BOSS_AFTER_WORDS;
          const track=journey.querySelector('.track');
          if(track)track.style.setProperty('--p',Math.min(100,(s.normal/WS_BOSS_AFTER_WORDS)*100)+'%');
        };

        const syncBossTestTrigger=()=>{
          if(s.boss||s.lives<=0||s.normal<WS_BOSS_AFTER_WORDS||s.feedback){
            if(!s.boss)wsBossTriggering=false;
            return;
          }
          if(wsBossTriggering)return;
          wsBossTriggering=true;
          s.boss=true;
          s.bossHp=3;
          s.bossMiss=0;
          s.feedback=null;
          setup();
        };

        const polishPauseButton=()=>{
          const pauseButton=document.getElementById('pause');
          if(!pauseButton)return;
          pauseButton.classList.add('ws-pause-button');
          pauseButton.textContent='';
          pauseButton.setAttribute('aria-label','Spiel pausieren');
          pauseButton.setAttribute('title','Pause');
        };
"""
          if text.count(state_anchor)!=1:
              raise SystemExit('Boss trigger state anchor mismatch')
          text=text.replace(state_anchor,state_anchor+'\n\n'+trigger_logic,1)

          old_apply="        const applyWordScramblePatches=()=>{fixSelectedLetters();showSuccessSparkles();syncBossProgress();syncBossSprite();syncBossReaction()};"
          new_apply="        const applyWordScramblePatches=()=>{fixSelectedLetters();showSuccessSparkles();polishPauseButton();syncBossProgress();syncBossTestJourney();syncBossTestTrigger();syncBossSprite();syncBossReaction()};"
          if text.count(old_apply)!=1:
              raise SystemExit('Apply patch anchor mismatch')
          text=text.replace(old_apply,new_apply,1)

          p.write_text(text,encoding='utf-8')
          PY

          grep -q "WS_BOSS_AFTER_WORDS=3" index.html
          grep -q "word-scramble-pause-button-style" index.html
          grep -q "syncBossTestTrigger" index.html
          grep -q "syncBossTestJourney" index.html
          git diff --check

      - name: Commit targeted runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f PAUSE_BOSS3_PATCH_TRIGGER
          git add index.html PAUSE_BOSS3_PATCH_TRIGGER
          if git diff --cached --quiet; then
            echo 'No targeted changes to commit.'
            exit 0
          fi
          git commit -m 'Improve pause button and trigger boss after three words'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
