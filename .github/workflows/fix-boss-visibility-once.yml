name: Fix Word Scramble boss visibility once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-boss-visibility-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch boss sprite fallback only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old="""          const level=getBossLevel();
          const desired=bossSprites[level-1];
          if(img.dataset.wsBossSprite!==desired){
            img.dataset.wsBossSprite=desired;
            img.alt=bossNames[level-1];
            img.loading='eager';
            img.decoding='async';
            img.src=desired;
            img.classList.remove('ws-boss-enter');
            void img.offsetWidth;
            img.classList.add('ws-boss-enter');
          }
"""
          new="""          const level=getBossLevel();
          const desired=bossSprites[level-1];
          if(!img.dataset.wsOriginalSrc){
            img.dataset.wsOriginalSrc=img.getAttribute('src')||'';
          }
          img.alt=bossNames[level-1];
          img.loading='eager';
          img.decoding='async';

          // Level 1 already ships with the original, valid Pirat-Kai sprite
          // inside the proven preview runtime. Do not replace it with a bad asset.
          if(level===1){
            img.dataset.wsBossSprite='original-level-1';
            img.onerror=null;
          }else if(img.dataset.wsBossSprite!==desired){
            const original=img.dataset.wsOriginalSrc;
            img.dataset.wsBossSprite=desired;
            img.onerror=()=>{
              if(original&&img.getAttribute('src')!==original){
                img.onerror=null;
                img.dataset.wsBossSprite='fallback-original';
                img.src=original;
              }
            };
            img.src=desired;
          }

          if(!img.classList.contains('ws-boss-enter')){
            img.classList.remove('ws-boss-enter');
            void img.offsetWidth;
            img.classList.add('ws-boss-enter');
          }
"""
          if text.count(old)!=1:
              raise SystemExit(f'Expected one boss sprite block, found {text.count(old)}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-boss-visibility-once.yml
          git add index.html .github/workflows/fix-boss-visibility-once.yml
          git commit -m 'Repair Word Scramble boss sprite visibility'
          git push origin HEAD:main
